name: TypeSpec and JSON Schema Contract IR admission

on:
  pull_request:
    paths:
      - "schema-authority-canary/**"
      - "contract-admission/contract-ir-consumer.json"
      - "validation/typespec/**"
      - "validation/public-contracts.v1.json"
      - "validation/tjsv-instances/**"
      - ".github/workflows/typespec-json-schema-peer-authority.yml"
  push:
    branches: [main, dev]
    paths:
      - "schema-authority-canary/**"
      - "contract-admission/contract-ir-consumer.json"
      - "validation/typespec/**"
      - "validation/public-contracts.v1.json"
      - "validation/tjsv-instances/**"
      - ".github/workflows/typespec-json-schema-peer-authority.yml"
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-ir-admission-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TSJSV_COMMIT: 7f32ec87bff6aac95c7fe23b9f7c592eb701568d

jobs:
  admission:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checked-out revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up the tested Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
      - name: Verify repository-owned consumer policy
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const manifest = JSON.parse(readFileSync("contract-admission/contract-ir-consumer.json", "utf8"));
          assert.equal(manifest.schema, "ores.contract-ir-consumer/v1");
          assert.equal(manifest.repository, process.env.GITHUB_REPOSITORY);
          assert.equal(manifest.repositoryRole, "interfaces");
          assert.equal(manifest.canonicalAuthorityRepository, process.env.GITHUB_REPOSITORY);
          assert.equal(manifest.evidenceScope, "repository-local-canary-and-public-contracts");
          assert.equal(manifest.validator.repository, "ORESoftware/typespec-json-schema-validator");
          assert.equal(manifest.validator.actionCommit, process.env.TSJSV_COMMIT);
          assert.equal(manifest.validator.contractIrSchema, "ores.typespec-json-schema-validator.contract-ir/v1");
          assert.equal(manifest.validator.consumerVerificationSchema, "ores.typespec-json-schema-validator.consumer-verification-receipt/v1");
          assert.equal(manifest.validator.consumerAdmissionNegativeCases, 19);
          assert.equal(manifest.authorityModel.precedence, "none");
          assert.equal(manifest.admission.requireExactSourceFileClosure, true);
          assert.equal(manifest.admission.requireDenseCompleteConsumerScope, true);
          assert.equal(manifest.admission.allowFallbackAuthority, false);
          NODE
      - name: Compare canary peer authorities and emit fresh Contract IR
        uses: ORESoftware/typespec-json-schema-validator@7f32ec87bff6aac95c7fe23b9f7c592eb701568d
        with:
          typespec: schema-authority-canary/main.tsp
          schema: schema-authority-canary/authored.schema.json
          report: .typespec-json-schema-validator/canary/report.json
          sarif: .typespec-json-schema-validator/canary/report.sarif
          contract_ir: .typespec-json-schema-validator/canary/contract-ir.json
          output_dir: .typespec-json-schema-validator/canary/generated
          max_probes: "64"
      - name: Require positive canary admission and nineteen canonical refusals
        uses: ORESoftware/typespec-json-schema-validator/actions/test-consumer-admission@7f32ec87bff6aac95c7fe23b9f7c592eb701568d
        with:
          contract_ir: .typespec-json-schema-validator/canary/contract-ir.json
          report: .typespec-json-schema-validator/canary/report.json
          typespec: schema-authority-canary/main.tsp
          schema: schema-authority-canary/authored.schema.json
          generated_schema: .typespec-json-schema-validator/canary/generated/typespec.generated.schema.json
          expected_declarations: '["OreSchemaAuthority.AuthorityKind","OreSchemaAuthority.PeerAuthorityRegistration"]'
          verification: .typespec-json-schema-validator/canary/consumer-verification.json
      - name: Assert canary consumer receipt
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const receipt = JSON.parse(readFileSync(".typespec-json-schema-validator/canary/consumer-verification.json", "utf8"));
          assert.equal(receipt.schema, "ores.typespec-json-schema-validator.consumer-verification-receipt/v1");
          assert.equal(receipt.status, "passed");
          assert.equal(receipt.admissible, true);
          assert.equal(receipt.failureCode, null);
          assert.equal(receipt.suppliedIrId, receipt.computedIrId);
          assert.equal(receipt.suppliedIrId, receipt.expectedIrId);
          NODE
      - name: Compare production public peer authorities and emit Contract IR
        uses: ORESoftware/typespec-json-schema-validator@7f32ec87bff6aac95c7fe23b9f7c592eb701568d
        with:
          typespec: validation/typespec/validation.tsp
          schema: validation/public-contracts.v1.json
          mapping: validation/typespec/tjsv-mapping.json
          instances: validation/tjsv-instances
          report: .typespec-json-schema-validator/public/report.json
          sarif: .typespec-json-schema-validator/public/report.sarif
          contract_ir: .typespec-json-schema-validator/public/contract-ir.json
          output_dir: .typespec-json-schema-validator/public/generated
          max_probes: "96"
      - name: Require production Contract IR to be admissible
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const report = JSON.parse(readFileSync(".typespec-json-schema-validator/public/report.json", "utf8"));
          const contractIr = JSON.parse(readFileSync(".typespec-json-schema-validator/public/contract-ir.json", "utf8"));
          assert.equal(report.status, "passed");
          assert.equal(contractIr.schema, "ores.typespec-json-schema-validator.contract-ir/v1");
          assert.equal(contractIr.admissible, true);
          assert.equal(report.findings.length, 0);
          NODE
      - name: Verify authored authorities were not modified
        shell: bash
        run: git diff --exit-code -- schema-authority-canary/ validation/typespec/validation.tsp validation/public-contracts.v1.json validation/tjsv-instances/
      - name: Retain diagnostic receipts, Contract IRs, SARIF, generated witnesses, and admission evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-ir-admission-${{ matrix.os }}-${{ github.event.repository.name }}-${{ github.run_id }}
          path: .typespec-json-schema-validator/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
