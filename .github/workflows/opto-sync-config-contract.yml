name: opto-sync-config-contract

on:
  pull_request:
    paths:
      - "contracts/opto-sync-config/**"
      - "examples/.opto-sync.toml"
      - "docs/opto-sync-config.md"
      - ".github/workflows/opto-sync-config-contract.yml"
  push:
    branches: [main]
    paths:
      - "contracts/opto-sync-config/**"
      - "examples/.opto-sync.toml"
      - "docs/opto-sync-config.md"
      - ".github/workflows/opto-sync-config-contract.yml"

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source commit under test
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Parse and validate example TOML invariants
        run: |
          python3 - <<'PY'
          import pathlib
          import tomllib

          doc = tomllib.loads(pathlib.Path('examples/.opto-sync.toml').read_text())
          assert doc['version'] == 1
          assert doc['strict'] is True
          assert doc['flags2env']['contract'] == '.cli-flags.toml'
          assert doc['flags2env']['require_audit'] is True
          assert doc['flags2env']['precedence'] == 'argv-over-env'

          sync = doc['sync']
          assert 100 <= sync['push_interval_ms'] <= 3_600_000
          assert 100 <= sync['pull_interval_ms'] <= 3_600_000
          assert 1 <= sync['max_batch_size'] <= 10_000
          assert sync['conflict_policy'] in {
              'server-wins', 'client-wins', 'last-write-wins', 'manual'
          }

          env = doc['env']
          names = [entry['name'] for entry in env]
          keys = [entry['key'] for entry in env]
          assert len(names) == len(set(names)), 'duplicate env binding name'
          assert len(keys) == len(set(keys)), 'duplicate env key'
          by_name = {entry['name']: entry for entry in env}

          for binding in env:
              if binding.get('secret'):
                  assert 'default' not in binding, f"secret default: {binding['name']}"

          for section_name in ('client', 'server'):
              section = doc.get(section_name, {})
              for field, binding_name in section.items():
                  if field.endswith('_binding'):
                      assert binding_name in by_name, (
                          f"unresolved {section_name}.{field}: {binding_name}"
                      )
          PY
      - name: Admit independent TypeSpec and JSON Schema authorities and instance corpus
        uses: ORESoftware/typespec-json-schema-validator@eb669d2c2c4f0800fac54f9b5a306b550121f1ac
        with:
          typespec: contracts/opto-sync-config/opto-sync-config.tsp
          schema: contracts/opto-sync-config/opto-sync-config.schema.json
          instances: contracts/opto-sync-config/instances
          report: .typespec-json-schema-validator/opto-sync-config-report.json
          contract_ir: .typespec-json-schema-validator/opto-sync-config-contract-ir.json
          output_dir: .typespec-json-schema-validator/opto-sync-config-generated

      - name: Admit current product Contract IR and prove canonical refusals
        uses: ORESoftware/typespec-json-schema-validator/actions/test-consumer-admission@eb669d2c2c4f0800fac54f9b5a306b550121f1ac
        with:
          contract_ir: .typespec-json-schema-validator/opto-sync-config-contract-ir.json
          report: .typespec-json-schema-validator/opto-sync-config-report.json
          typespec: contracts/opto-sync-config/opto-sync-config.tsp
          schema: contracts/opto-sync-config/opto-sync-config.schema.json
          generated_schema: .typespec-json-schema-validator/opto-sync-config-generated/typespec.generated.schema.json
          expected_declarations: '["OptoSync.Config.OptoSyncMode","OptoSync.Config.EnvKind","OptoSync.Config.Flags2EnvPrecedence","OptoSync.Config.ConflictPolicy","OptoSync.Config.Flags2EnvConfig","OptoSync.Config.EnvBinding","OptoSync.Config.SyncPolicy","OptoSync.Config.OptoSyncClientConfig","OptoSync.Config.OptoSyncServerConfig","OptoSync.Config.OptoSyncConfig"]'
          verification: .typespec-json-schema-validator/opto-sync-config-consumer-verification.json
      - name: Preserve the independent authored inputs
        run: git diff --exit-code -- contracts/opto-sync-config/
      - name: Preserve real admission evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opto-sync-config-contract-${{ github.event.pull_request.head.sha || github.sha }}
          path: .typespec-json-schema-validator/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
