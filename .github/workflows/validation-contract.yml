name: validation-contract

on:
  pull_request:
    paths: ["validation/**", "scripts/check-validation-contract.py", "scripts/check-typespec-json-schema.py", "tests/test_typespec_json_schema.py", "package.json", "package-lock.json", ".github/workflows/validation-contract.yml"]
  push:
    branches: [main]
    paths: ["validation/**", "scripts/check-validation-contract.py", "scripts/check-typespec-json-schema.py", "tests/test_typespec_json_schema.py", "package.json", "package-lock.json", ".github/workflows/validation-contract.yml"]

permissions:
  contents: read

jobs:
  public-authorities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:typespec
      - run: python3 scripts/check-validation-contract.py
      - run: python3 scripts/check-typespec-json-schema.py
      - run: python3 -m unittest discover -s tests -p 'test_typespec_json_schema.py' -v
      - run: python3 -m json.tool validation/public-contracts.v1.json >/dev/null
      - run: python3 -m json.tool validation/route-bindings.v1.json >/dev/null
